services:
  - type: web
    name: professor-pepe-agent
    runtime: docker
    repo: https://github.com/dav131207/KI-Agent-RAG
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: analytics-data
      mountPath: /app/backend/data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        value: REPLACE_ME
      # Chat is latency-critical: the larger Flash models need ~3.4s to their
      # first token from here, a lite model ~0.6s. Measured, and independent of
      # the prompt.
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      # Social posts are generated behind a modal and carry detailed goal
      # instructions, so nuance is worth more there than speed.
      - key: GEMINI_POST_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: IMAGE_API_BASE
        value: https://onlypepes.com
      - key: QDRANT_URL
        value: REPLACE_ME
      - key: QDRANT_API_KEY
        value: REPLACE_ME
      - key: QDRANT_COLLECTION
        value: professor_pepe
      - key: WATERMARK_PATH
        value: /app/backend/assets/watermark.png
      - key: MEMES_DIR
        value: /app/backend/memes
      - key: PYTHONUNBUFFERED
        value: "1"
